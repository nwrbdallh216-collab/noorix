<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOORIX - المحادثات العامة</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 15px;
            background: #111;
            text-align: center;
            border-bottom: 1px solid #222;
            font-size: 18px;
            font-weight: bold;
        }
        .chat-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message-bubble {
            background: #222;
            padding: 10px 15px;
            border-radius: 10px;
            max-width: 80%;
            font-size: 14px;
        }
        .message-bubble span {
            display: block;
            font-size: 10px;
            color: #888;
            margin-bottom: 3px;
        }
        .chat-input-area {
            display: flex;
            padding: 10px;
            background: #111;
            border-top: 1px solid #222;
        }
        input {
            flex: 1;
            padding: 10px;
            background: #222;
            border: none;
            border-radius: 5px;
            color: #fff;
            font-size: 14px;
        }
        button {
            background: #ff0050;
            color: white;
            border: none;
            padding: 0 20px;
            margin-right: 8px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        .back-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-btn">⬅️ رجوع</a>
        محادثات NOORIX العامة 💬
    </header>

    <div class="chat-container" id="chatBox">
        <div class="message-bubble">
            <span>@noor_official</span>
            أهلاً بكم في دردشة تطبيق NOORIX! شاركونا آرائكم هنا ✨
        </div>
    </div>

    <div class="chat-input-area">
        <button onclick="sendMessage()">إرسال</button>
        <input type="text" id="msgInput" placeholder="اكتب رسالتك العامة...">
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('msgInput');
            const chatBox = document.getElementById('chatBox');
            if (!input.value.trim()) return;

            const div = document.createElement('div');
            div.className = 'message-bubble';
            div.innerHTML = `<span>@أنتِ</span>${input.value}`;
            chatBox.appendChild(div);
            
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
