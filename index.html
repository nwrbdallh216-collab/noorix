<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOORIX - Your World, Your Videos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            text-align: center;
            padding: 12px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            z-index: 10;
        }
        header h1 { font-size: 20px; letter-spacing: 2px; }
        header p { font-size: 10px; color: #aaa; }

        .feed-container {
            flex: 1;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            height: 100vh;
            background: #111;
        }
        .video-card {
            position: relative;
            width: 100%;
            height: 100vh;
            scroll-snap-align: start;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }
        .video-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-info {
            position: absolute;
            bottom: 70px;
            right: 15px;
            z-index: 5;
            text-align: right;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        .video-info h3 { font-size: 16px; margin-bottom: 5px; }
        .video-info p { font-size: 13px; color: #ddd; }

        .sidebar-actions {
            position: absolute;
            bottom: 80px;
            left: 15px;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .action-btn {
            background: rgba(0, 0, 0, 0.4);
            border: none;
            color: white;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wallet-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(255, 215, 0, 0.2);
            border: 1px solid gold;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            color: gold;
            z-index: 10;
            cursor: pointer;
        }

        nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            background-color: rgba(0, 0, 0, 0.9);
            border-top: 1px solid #222;
            z-index: 10;
        }
        nav div { font-size: 12px; color: #888; cursor: pointer; }
        nav div.active { color: #fff; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>NOORIX</h1>
        <p>YOUR WORLD. YOUR VIDEOS</p>
    </header>

    <div class="wallet-badge" onclick="alert('أرباحك الحالية: $142.50 - استمري في النشر لجني المزيد!')">
        💰 الأرباح: $142.50
    </div>

    <div class="feed-container">
        <div class="video-card">
            <video src="https://assets.mixkit.co/videos/preview/mixkit-girl-in-neon-sign-1232-large.mp4" autoplay loop muted playsinline></video>
            <div class="video-info">
                <h3>@noor_creator</h3>
                <p>بداية إطلاق تطبيق NOORIX العظيم! 🚀✨</p>
            </div>
            <div class="sidebar-actions">
                <button class="action-btn" onclick="this.style.color='red'">❤️</button>
                <button class="action-btn">💬</button>
                <button class="action-btn">↗️</button>
            </div>
        </div>

        <div class="video-card">
            <video src="https://assets.mixkit.co/videos/preview/mixkit-hands-holding-a-smartphone-with-a-green-screen-42938-large.mp4" autoplay loop muted playsinline></video>
            <div class="video-info">
                <h3>@tech_girl</h3>
                <p>كيف تبنين تطبيقك الخاص بكل سهولة 💡</p>
            </div>
            <div class="sidebar-actions">
                <button class="action-btn" onclick="this.style.color='red'">❤️</button>
                <button class="action-btn">💬</button>
                <button class="action-btn">↗️</button>
            </div>
        </div>
    </div>

    <nav>
        <div class="active">الرئيسية</div>
        <div onclick="window.location.href='index.html'">اكتشف</div>
        <div onclick="window.location.href='index.html'">➕ رفع</div>
        <div onclick="window.location.href='chat.html'">الرسائل</div>
        <div onclick="window.location.href='auth.html'">حسابي</div>
    </nav>

</body>
</html>
