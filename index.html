<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOORIX - YOUR WORLD. YOUR VIDEOS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #000; color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; position: absolute; top: 0; left: 0; width: 100%; z-index: 10; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); }
        .logo { font-size: 20px; font-weight: bold; letter-spacing: 1px; }
        .logo span { font-size: 10px; display: block; color: #aaa; }
        .profits { background: #d4af37; color: #000; padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; }

        .feed-container { flex: 1; overflow-y: scroll; scroll-snap-type: y mandatory; height: 100vh; width: 100%; }
        .video-card { scroll-snap-align: start; height: 100vh; width: 100%; position: relative; display: flex; justify-content: center; align-items: center; background: #111; }
        .video-card video { width: 100%; height: 100%; object-fit: cover; }
        
        .video-info { position: absolute; bottom: 70px; left: 20px; right: 80px; z-index: 5; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .username { font-weight: bold; font-size: 16px; margin-bottom: 8px; }
        .caption { font-size: 14px; color: #ddd; }

        .sidebar { position: absolute; right: 15px; bottom: 80px; display: flex; flex-direction: column; align-items: center; gap: 20px; z-index: 5; }
        .side-btn { background: rgba(0,0,0,0.4); border: none; color: #fff; width: 45px; height: 45px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; cursor: pointer; }

        .nav-bar { display: flex; justify-content: space-around; align-items: center; background: #000; border-top: 1px solid #222; height: 60px; position: fixed; bottom: 0; left: 0; width: 100%; z-index: 10; }
        .nav-item { color: #888; text-decoration: none; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-item.active { color: #fff; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">NOORIX <span>YOUR WORLD. YOUR VIDEOS</span></div>
        <div class="profits">💰 الأرباح: $142.50</div>
    </div>

    <div class="feed-container">
        <div class="video-card">
            <video src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" autoplay loop muted playsinline></video>
            <div class="video-info">
                <div class="username">@noor_creator</div>
                <div class="caption">بداية إطلاق تطبيق NOORIX العظيم! 🚀✨</div>
            </div>
            <div class="sidebar">
                <button class="side-btn">❤️</button>
                <button class="side-btn">💬</button>
                <button class="side-btn">↗️</button>
            </div>
        </div>

        <div class="video-card">
            <video src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4" loop muted playsinline></video>
            <div class="video-info">
                <div class="username">@tech_girl</div>
                <div class="caption">أجمل لحظات البرمجة وتطوير التطبيقات 🔥💻</div>
            </div>
            <div class="sidebar">
                <button class="side-btn">❤️</button>
                <button class="side-btn">💬</button>
                <button class="side-btn">↗️</button>
            </div>
        </div>
    </div>

    <div class="nav-bar">
        <a href="index.html" class="nav-item active">🏠 الرئيسية</a>
        <a href="#" class="nav-item">🧭 اكتشف</a>
        <a href="#" class="nav-item">➕ رفع</a>
        <a href="chat.html" class="nav-item">💬 الرسائل</a>
        <a href="auth.html" class="nav-item">👤 حسابي</a>
    </div>

    <script>
        const videos = document.querySelectorAll('video');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.play();
                } else {
                    entry.target.pause();
                }
            });
        }, { threshold: 0.6 });

        videos.forEach(video => observer.observe(video));
    </script>
</body>
</html>
